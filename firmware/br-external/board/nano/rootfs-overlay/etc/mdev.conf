# mdev rules (busybox mdev, /proc/sys/kernel/hotplug). The first matching rule wins.
#
# AIC8800 Wi-Fi/Bluetooth adapters first enumerate as a "driver CD" (usb-storage ignores it, kernel
# quirk): aic-modeswitch.sh (in the background) runs usb_modeswitch with the standard configuration in
# /etc/usb_modeswitch.d/<vid>:<pid> and, for a stick that does not answer it, ejects the CD through
# usb-storage; the adapter re-enumerates in Wi-Fi/Bluetooth mode.
$PRODUCT=(a69c/572[1-7acf]|1111/1111)/.*	root:root 660 @[ "$DEVTYPE" = usb_device ] && /lib/mdev/aic-modeswitch.sh
# kernel modules by device alias (modules.alias, depmod): Wi-Fi, Bluetooth and any other module driver
$MODALIAS=.*	root:root 660 @modprobe -q -b "$MODALIAS"
# block devices: USB drives are mounted under /media (blockdev.sh: the stock automounter, never for
# the AIC driver CD)
sd[a-z]		root:root 660 */lib/mdev/blockdev.sh
sd[a-z][0-9]	root:root 660 */lib/mdev/blockdev.sh
# network interfaces from /etc/network/interfaces: ifup when they appear, ifdown
# when they go (wpa_supplicant and udhcpc are started and stopped by ifupdown)
wlan[0-9]	root:root 660 */lib/mdev/ifupdown.sh
usb[0-9]	root:root 660 */lib/mdev/ifupdown.sh
eth[0-9]	root:root 660 */lib/mdev/ifupdown.sh
# Tetra Amp Plus controller (RP2040 CDC-ACM) as /dev/tetra-amp
ttyACM[0-9]+	root:root 660 */lib/mdev/tetra-amp.sh
