# BlueZ main configuration (Pluto Nano firmware). Only the settings that differ from the BlueZ defaults
# are set; see bluetoothd's own main.conf documentation for the rest.
[General]

[Policy]
# Power on every controller as soon as it appears: the USB Bluetooth adapter can enumerate long after
# bluetoothd started (usb_mode = auto switches the port to host only after ~20-30 s).
AutoEnable=true
