# RTEMS 6.2 BSP for the Pluto Nano: the ZedBoard variant of xilinx_zynq (512 MB DDR, PS_CLK
# 33.333 MHz, CPU 666.67 MHz -> PERIPHCLK 333.33 MHz, console UART1) with the Nano's 100 MHz UART
# reference clock (system_top.xsa: PCW_ACT_UART_PERIPHERAL_FREQMHZ = 100).
[arm/xilinx_zynq_zedboard]
RTEMS_SMP = True
RTEMS_POSIX_API = True
BUILD_TESTS = False
ZYNQ_CLOCK_UART = 100000000
BSP_ARM_A9MPCORE_PERIPHCLK = 333333333
