# RTEMS 6.2 BSP for the Pluto Nano: the ZedBoard variant of xilinx_zynq (512 MB DDR, console
# UART1 are its defaults). Clocks are read from the SLCR at run time (app/platform.c); the values
# here are only fallbacks (system_top.xsa: UART ref 100 MHz). 16 MiB non-cacheable pool for USB
# and AD9363 DMA buffers (default 1 MiB).
[arm/xilinx_zynq_zedboard]
RTEMS_SMP = True
RTEMS_POSIX_API = True
BUILD_TESTS = False
ZYNQ_CLOCK_UART = 100000000
ZYNQ_RAM_NOCACHE_LENGTH = 0x01000000
