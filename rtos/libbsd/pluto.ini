#
# Pluto Nano (Nexus-BS RTOS): default set + USB Wi-Fi (rtwn, net80211, wpa_supplicant),
# without the NXP DPAA, NVMe, Marvell and TI MMC parts. Copied into rtems-libbsd/buildset/.
#
#

[general]
name = pluto

[modules]
altq = on
base = on
cam = on
contrib_expat = on
contrib_libpcap = on
crypto = on
crypto_openssl = on
dev_input = on
dev_net = on
dev_nic = on
dev_nic_broadcomm = on
dev_nic_dc = on
dev_nic_e1000 = on
dev_nic_xilinx = on
dev_nic_fxp = on
dev_nic_re = on
dev_nic_smc = on
dev_usb = on
dev_usb_controller = on
dev_usb_controller_bbb = on
dev_usb_input = on
dev_usb_net = on
dev_usb_quirk = on
dev_usb_serial = on
dev_usb_storage = on
dev_usb_wlan = on
dev_wlan_rtwn = on
dhcpcd = on
dpaa = off
evdev = on
fdt = on
fs_nfs = on
fs_nfsclient = on
if_mve = off
imx = on
in_cksum = on
mdnsresponder = on
mmc = on
mmc_ti = off
net = on
net80211 = on
netinet = on
netinet6 = on
netipsec = off
nfsv2 = off
nfs = on
nvme = off
opencrypto = on
pci = on
pf = on
regulator = on
rpc = on
rpc_user = on
rtems = on
tests = on
tsi148 = off
tty = on
user_space = on
user_space_wlanstats = on
usr_bin_openssl = on
usr_sbin_tcpdump = on
usr_sbin_wpa_supplicant = on
nvlib_user = on
nvlib = on
