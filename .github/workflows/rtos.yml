name: rtos (Nexus-BS RTEMS image, no Linux)
# Bitstream: the nano-system_top.xsa of the last successful v0.39-std firmware run (same HDL
# inputs, checked by firmware/xsa-key.sh). Toolchain and BSP+libbsd are cached; the image is
# rebuilt every run. Output: rtos.itb (FIT: fpga + RTEMS kernel) for `run dfu_ram` + `bootm`.
on:
  workflow_dispatch:
    inputs:
      xsa_run: { description: 'firmware.yml run id with nano-system_top.xsa (empty = last v0.39-std success)', required: false }
  push:
    branches: [Nexus-BS-2.0_RTOS]
    paths: ['rtos/**', '.github/workflows/rtos.yml']
permissions: { actions: read, contents: write }
env:
  RTEMS_TOOLS: /opt/rtems/6
  RTEMS_BSP_PREFIX: /opt/rtems/bsp
  WOLF_PREFIX: /opt/rtems/wolf
jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Host packages
        run: sudo apt-get update -q && sudo apt-get install -y -q build-essential flex bison texinfo unzip zlib1g-dev python3-dev libncurses-dev pkg-config u-boot-tools xz-utils device-tree-compiler qemu-system-arm
      - name: Bitstream (xsa from the v0.39-std firmware run)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          RUN='${{ inputs.xsa_run }}'
          [ -n "$RUN" ] || RUN=$(gh run list -R "$GITHUB_REPOSITORY" -b v0.39-std -w firmware.yml -s success -L 1 --json databaseId --jq '.[0].databaseId')
          echo "xsa from run $RUN"
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n nano-system_top.xsa -D xsa
          unzip -l xsa/system_top.xsa | grep -E 'system_top.bit|ps7_init.c'
          unzip -p xsa/system_top.xsa system.hwh | grep -oE 'PCW_ACT_(APU|UART|USB0)_PERIPHERAL_FREQMHZ" VALUE="[^"]*"'
      - name: Toolchain cache
        id: tc
        uses: actions/cache/restore@v4
        with: { path: '${{ env.RTEMS_TOOLS }}', key: 'rtems-6.2-arm-tools-v1-${{ hashFiles(''rtos/ci/toolchain.sh'') }}' }
      - name: RTEMS 6.2 toolchain (source builder, first run only)
        if: steps.tc.outputs.cache-hit != 'true'
        run: sudo mkdir -p $RTEMS_TOOLS && sudo chown runner $RTEMS_TOOLS && rtos/ci/toolchain.sh $RTEMS_TOOLS
      - name: Save the toolchain now (kept even if a later step fails)
        if: steps.tc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: '${{ env.RTEMS_TOOLS }}', key: '${{ steps.tc.outputs.cache-primary-key }}' }
      - name: BSP + libbsd cache
        id: bsp
        uses: actions/cache/restore@v4
        with: { path: '${{ env.RTEMS_BSP_PREFIX }}', key: 'rtems-6.2-pluto-bsp-v1-${{ hashFiles(''rtos/ci/bsp.sh'', ''rtos/bsp/**'', ''rtos/libbsd/*'', ''rtos/libbsd/aic8800/if_aicwf_usb.c'', ''rtos/libbsd/aic8800/aicwf_usbif.h'', ''rtos/libbsd/aic8800/fetch-firmware.sh'', ''rtos/libbsd/aic8800/gen_fwdata.py'', ''rtos/ci/toolchain.sh'') }}' }
      - name: RTEMS kernel (Pluto BSP) + libbsd with the Zynq EHCI glue
        if: steps.bsp.outputs.cache-hit != 'true'
        run: sudo mkdir -p $RTEMS_BSP_PREFIX && sudo chown runner $RTEMS_BSP_PREFIX && rtos/ci/bsp.sh $RTEMS_TOOLS $RTEMS_BSP_PREFIX
      - name: Save BSP + libbsd now
        if: steps.bsp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: '${{ env.RTEMS_BSP_PREFIX }}', key: '${{ steps.bsp.outputs.cache-primary-key }}' }
      - name: Native Pluto driver host unit tests (framing, timestamps, DMA ring)
        run: make -C rtos/sdr/test
      - name: SoapySDR + native Pluto driver cache
        id: sdr
        uses: actions/cache/restore@v4
        with: { path: /opt/rtems/sdr, key: 'rtems-6.2-pluto-sdr-v1-${{ hashFiles(''rtos/sdr/**'', ''rtos/ci/bsp.sh'', ''rtos/bsp/**'', ''rtos/ci/toolchain.sh'') }}' }
      - name: SoapySDR 0.8.1 + native Pluto driver (libSoapySDR.a, libSoapyPlutoRtems.a with ADI no-OS)
        id: sdrb
        if: steps.sdr.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          sudo mkdir -p /opt/rtems/sdr && sudo chown runner /opt/rtems/sdr
          rtos/sdr/build-soapysdr.sh $RTEMS_TOOLS $RTEMS_BSP_PREFIX /opt/rtems/sdr
          rtos/sdr/fetch-noos.sh $RUNNER_TEMP/noos
          rtos/sdr/build-pluto-driver.sh $RTEMS_TOOLS $RTEMS_BSP_PREFIX /opt/rtems/sdr $RUNNER_TEMP/noos /opt/rtems/sdr
      - name: Save SoapySDR + native Pluto driver now
        if: steps.sdr.outputs.cache-hit != 'true' && steps.sdrb.outcome == 'success'
        uses: actions/cache/save@v4
        with: { path: /opt/rtems/sdr, key: '${{ steps.sdr.outputs.cache-primary-key }}' }
      - name: Rust nightly with rust-src (build-std)
        run: rustup toolchain install nightly --profile minimal --component rust-src && rustc +nightly -V
      - name: Rust std probe (M3, armv7-rtems-eabihf)
        id: rust
        continue-on-error: true
        run: rtos/rust-probe/build.sh $RTEMS_TOOLS $RTEMS_BSP_PREFIX $PWD/librust.a
      - name: wolfSSL + wolfSSH cache
        id: wolf
        uses: actions/cache/restore@v4
        with: { path: '${{ env.WOLF_PREFIX }}', key: 'rtems-6.2-wolfssh-v1-${{ hashFiles(''rtos/ci/wolfssh.sh'', ''rtos/ssh/user_settings.h'', ''rtos/ci/toolchain.sh'') }}' }
      - name: wolfSSL + wolfSSH for the SSH server (M2e; image builds without SSH if this fails)
        id: wolfb
        if: steps.wolf.outputs.cache-hit != 'true'
        continue-on-error: true
        run: sudo mkdir -p $WOLF_PREFIX && sudo chown runner $WOLF_PREFIX && rtos/ci/wolfssh.sh $RTEMS_TOOLS $RTEMS_BSP_PREFIX $WOLF_PREFIX
      - name: Save wolfSSL + wolfSSH now
        if: steps.wolf.outputs.cache-hit != 'true' && steps.wolfb.outcome == 'success'
        uses: actions/cache/save@v4
        with: { path: '${{ env.WOLF_PREFIX }}', key: '${{ steps.wolf.outputs.cache-primary-key }}' }
      - name: Image
        env:
          RUST_LIB: '${{ github.workspace }}/librust.a'
          # SSH host key (OpenSSH ed25519; empty = ephemeral key per build), read by
          # rtos/ssh/gen_secrets.py. SSH passwords are the nexus2 dashboard credentials.
          NEXUS_SSH_HOSTKEY: '${{ secrets.NEXUS_SSH_HOSTKEY }}'
          # first-boot Wi-Fi network when /data/nexus.conf has none (rtos/config/gen-wifi-defaults.sh)
          NEXUS_WIFI_SSID: '${{ secrets.NEXUS_WIFI_SSID }}'
          NEXUS_WIFI_PSK: '${{ secrets.NEXUS_WIFI_PSK }}'
        run: rtos/ci/image.sh $RTEMS_TOOLS $RTEMS_BSP_PREFIX xsa/system_top.xsa out
      - name: QEMU smoke test (xilinx-zynq-a9, console on UART1)
        continue-on-error: true
        run: |
          timeout 45 qemu-system-arm -M xilinx-zynq-a9 -m 512M -no-reboot -nographic \
            -serial null -serial mon:stdio -kernel out/nexus-rtos.elf </dev/null > out/qemu.log 2>&1 || true
          cat out/qemu.log | head -80
          # QEMU's PL310 model reports an ID the ZedBoard BSP rejects (fatal 0x900, L2C-310
          # unexpected ID) before Init: that only proves the start code ran up to the L2 setup.
          if grep -q "fatal code: 2304" out/qemu.log; then echo "::warning::QEMU L2C-310 model limit (start code reached L2 init)"; exit 0; fi
          grep -q "Nexus-BS RTOS" out/qemu.log
      - name: nexus2 commit (rtos/NEXUS_REF pins the Nexus-BS-2.0_RTOS commit of this image)
        id: nref
        run: echo "ref=$(cat rtos/NEXUS_REF)" >> "$GITHUB_OUTPUT"
      - name: nexus2 source (private repo, read-only deploy key)
        id: nsrc
        continue-on-error: true
        uses: actions/checkout@v4
        with: { repository: invictus737/nexus-bs2-src, ref: '${{ steps.nref.outputs.ref }}', path: nexus, ssh-key: '${{ secrets.NEXUS_SRC_KEY }}' }
      - name: nexus2 on RTEMS (type check report)
        if: steps.nsrc.outcome == 'success'
        continue-on-error: true
        run: rtos/ci/nexus2-check.sh $RTEMS_TOOLS $RTEMS_BSP_PREFIX $PWD/nexus $PWD/out/nexus2-rtems-check.txt
      - name: Station image (nexus2 + native Pluto driver linked into RTEMS)
        id: n2img
        if: steps.nsrc.outcome == 'success'
        continue-on-error: true
        env:
          NEXUS_SSH_HOSTKEY: '${{ secrets.NEXUS_SSH_HOSTKEY }}'
          NEXUS_WIFI_SSID: '${{ secrets.NEXUS_WIFI_SSID }}'
          NEXUS_WIFI_PSK: '${{ secrets.NEXUS_WIFI_PSK }}'
        run: rtos/ci/image-nexus2.sh $RTEMS_TOOLS $RTEMS_BSP_PREFIX /opt/rtems/sdr $PWD/nexus xsa/system_top.xsa out
      - name: Outputs to a draft release (repository is public; drafts are visible to collaborators only)
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG=rtos-ci-${{ github.run_number }}
          FILES=$(ls out/rtos-nexus2.itb out/nexus2.map out/rtos.itb out/nexus-rtos.elf out/nexus-rtos.map out/SHA256SUMS out/qemu.log out/nexus2-rtems-check.txt out/nexus2-rtems-check.txt.raw out/nexus2-link.log rtos/rust-probe/build-*.log 2>/dev/null || true)
          [ -n "$FILES" ] || { echo "nothing to publish"; exit 0; }
          gh release create "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "RTOS CI ${{ github.run_number }} (${GITHUB_SHA::7})" --notes "Draft: CI outputs of the Nexus-BS RTOS branch, not a release."
          # keep only the 5 newest RTOS CI drafts
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,createdAt \
            --jq '[.[] | select(.isDraft and (.tagName | startswith("rtos-ci-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes; done
      # the station steps continue on error so the draft release still gets the logs; the run
      # must not look green when the image the board needs was not built
      - name: Station image result
        if: always()
        run: |
          if [ "${{ steps.nsrc.outcome }}" != "success" ]; then echo "::error::nexus2 source checkout failed: no station image"; exit 1; fi
          if [ "${{ steps.n2img.outcome }}" != "success" ] || [ ! -f out/rtos-nexus2.itb ]; then echo "::error::station image (rtos-nexus2.itb) not built, see nexus2-link.log in the draft release"; exit 1; fi
