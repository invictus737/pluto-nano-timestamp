name: apps.frm (application slot)
# Assembles apps.frm from the release assets of tag `inputs_tag` in this repository:
#   nexus2               stripped ARMv7 musl (armv7-unknown-linux-musleabihf) ELF
#   nexus-apps.tar.xz    contrib/pluto/apps verbatim (provision.sh, start.sh, defaults/ at the top level)
#   svxlink-root.tar.xz  sanitized SvxLink tree (bin lib share var etc/svxlink at the top level)
#   SHA256SUMS           sha256sum lines for the three files above
# plus the pinned Tezuka v0.3.24 Nano boot images, and publishes apps.frm (no FSBL), apps-cpu1100-ddr750.frm,
# apps-stock-clock.frm, SHA256SUMS and README.md as an artifact and as release
# apps-<inputs_tag>.
on:
  # push only registers the workflow on this (non-default) branch; the job runs on dispatch
  push: { branches: [v0.39-std], paths: ['.github/workflows/apps.yml'] }
  workflow_dispatch:
    inputs:
      inputs_tag: { description: 'release tag holding the inputs', required: true, type: string }
permissions: { contents: write }
jobs:
  apps:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', APPS_INPUTS_TAG: '${{ inputs.inputs_tag }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Inputs from release ${{ inputs.inputs_tag }}
        run: |
          mkdir -p in
          for a in nexus2 nexus-apps.tar.xz svxlink-root.tar.xz SHA256SUMS; do
            gh release download "$APPS_INPUTS_TAG" --pattern "$a" --dir in
          done
          ls -la in
      - name: Assemble apps.frm
        run: |
          firmware/build-apps-frm.sh in out | tee build.txt
          cd out && rm -f apps-cpu950-ddr600.frm && sha256sum apps*.frm > SHA256SUMS
          { echo "# apps-$APPS_INPUTS_TAG"
            echo
            echo "Application slot for the pluto-nano-timestamp v0.39-std firmware (stage 1 must be installed)."
            echo "Copy **exactly one** of these files to the Pluto's USB drive and eject:"
            echo
            echo "| file | FSBL written | bytes | sha256 |"
            echo "|---|---|---|---|"
            for f in apps.frm apps-stock-clock.frm apps-cpu1100-ddr750.frm; do
              case $f in apps.frm) c="none (installed clock kept)" ;; apps-stock-clock.frm) c="standard clocks" ;;
                apps-cpu1100-ddr750.frm) c="CPU 1100 MHz, DDR 750 MT/s: tested on the reference board only (HamGeek Pluto Nano Rev.B) WITH HEATSINKS AND A FAN INSTALLED, ran for days; not a Tezuka-published test result; above the -1 speed grade spec — do not use without active cooling" ;; esac
              echo "| \`$f\` | $c | $(stat -c %s $f) | \`$(sha256sum $f | cut -c1-16)…\` |"
            done
            echo
            echo "Inputs: release \`$APPS_INPUTS_TAG\`; built by run ${{ github.run_id }} at $(git rev-parse --short HEAD)."
          } > README.md
          cat README.md
      - uses: actions/upload-artifact@v4
        with: { name: 'apps-${{ inputs.inputs_tag }}', path: "out/*.frm\nout/SHA256SUMS\nout/README.md", if-no-files-found: error }
      - name: Release apps-${{ inputs.inputs_tag }}
        run: |
          T="apps-$APPS_INPUTS_TAG"
          gh release view "$T" > /dev/null 2>&1 || gh release create "$T" --title "$T" --notes-file out/README.md
          gh release edit "$T" --notes-file out/README.md
          gh release upload "$T" out/*.frm out/SHA256SUMS out/README.md --clobber
