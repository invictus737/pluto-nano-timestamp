name: firmware (GitHub-hosted, Vivado installed in the job)
on:
  workflow_dispatch:
    inputs:
      vivado:
        description: 'Vivado version (ADI v0.39 is released for 2023.2; 2022.2 builds with the ADI version check off)'
        default: '2022.2'
        type: choice
        options: ['2022.2', '2023.2']
env:
  VIVADO_VERSION: ${{ inputs.vivado || '2022.2' }}
permissions: { contents: write, actions: read }
jobs:
  hdl:
    name: Nano bitstream (Vivado ${{ inputs.vivado || '2022.2' }} on the runner)
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    outputs:
      cache-hit: ${{ steps.xsa-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - name: Bitstream cache key (Nano HDL inputs, v0.39 patches, timestamp IP, Vivado version)
        id: key
        run: echo "key=$(firmware/xsa-key.sh "$VIVADO_VERSION")" >> "$GITHUB_OUTPUT"
      - name: Restore Nano bitstream
        id: xsa-cache
        uses: actions/cache/restore@v4
        with: { path: xsa-cache/system_top.xsa, key: '${{ steps.key.outputs.key }}' }
      # Two passes: first strip the preinstalled toolchains from the 73 GB root disk (frees 25-30 GB),
      # then merge what is left with the temp disk into one LVM volume. A single pass gave 28 GB,
      # Vivado with Zynq-7000 only needs about 35 GB (download staging + install).
      - name: Free disk space (preinstalled SDKs, tool cache, large packages)
        if: steps.xsa-cache.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: true, android: true, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }
      - name: Free more disk space (the Vivado install needs about 48 GB on this single 75 GB disk)
        if: steps.xsa-cache.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/node_modules /usr/local/share/powershell /usr/local/share/chromium /usr/local/julia* \
            /usr/share/swift /usr/share/miniconda /usr/lib/jvm /usr/lib/google-cloud-sdk /usr/lib/firefox \
            /opt/microsoft /opt/google /opt/az /opt/pipx /opt/hostedtoolcache /home/linuxbrew /usr/local/aws-cli \
            /usr/local/share/vcpkg /usr/local/.ghcup /usr/share/kotlinc /usr/local/bin/{minikube,kind,kubectl,helm,pulumi*,terraform,packer} || true
          sudo apt-get clean; sudo journalctl --vacuum-size=20M >/dev/null 2>&1 || true
          df -h /
      # The Vivado 2022.2 web installer refuses to start below 55 GB free on the destination,
      # although Zynq-7000 only writes far less. Root (~42 GB free after cleanup) and the temp
      # disk (~70 GB) are joined into one LVM volume backed by sparse files, so the reported size
      # passes the check while real usage stays within the physical space of both disks.
      - name: Build volume (sparse, on the temp disk only; the root disk keeps the runner's own space)
        if: steps.xsa-cache.outputs.cache-hit != 'true'
        run: |
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile /swapfile
          TMP_FREE=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9); echo "temp free ${TMP_FREE}G"
          # declared size is twice the physical free space: the Vivado installer insists on 55 GB
          # free although a Zynq-7000-only install plus its download is far smaller
          sudo truncate -s $((TMP_FREE * 2))G /mnt/pv-tmp.img
          A=$(sudo losetup --find --show /mnt/pv-tmp.img)
          sudo mkfs.ext4 -q -m0 -E lazy_itable_init=1,nodiscard "$A"
          sudo mkdir -p /mnt/build && sudo mount -o noatime "$A" /mnt/build && sudo chown runner:runner /mnt/build
          # everything the installer writes goes there: home cache, temp, download staging
          mkdir -p /mnt/build/home-xilinx /mnt/build/tmp /mnt/build/tools /mnt/build/vartmp && rm -rf ~/.Xilinx && ln -s /mnt/build/home-xilinx ~/.Xilinx
          # the installer also defaults some modules (Information Center) to /tools/Xilinx on the root disk
          sudo rm -rf /tools && sudo ln -s /mnt/build/tools /tools
          sudo mount --bind /mnt/build/vartmp /var/tmp && sudo chmod 1777 /mnt/build/vartmp /mnt/build/tmp
          echo "TMPDIR=/mnt/build/tmp" >> "$GITHUB_ENV"
          echo "_JAVA_OPTIONS=-Djava.io.tmpdir=/mnt/build/tmp" >> "$GITHUB_ENV"
          df -h / /mnt /mnt/build
      - if: steps.xsa-cache.outputs.cache-hit != 'true'
        run: df -h / /mnt/build && free -g && nproc && sudo mkdir -p /mnt/build/Xilinx /mnt/build/work && sudo chown -R runner:runner /mnt/build
      - name: Vivado prerequisites
        if: steps.xsa-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q expect libtinfo5 libncurses5 libx11-6 libxext6 libxrender1 libxtst6 libxi6 libfreetype6 libfontconfig1 locales && sudo locale-gen en_US.UTF-8
      - name: Vivado from the saved image (fast path)
        id: vimg
        if: steps.xsa-cache.outputs.cache-hit != 'true'
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          set +e; firmware/vivado-image.sh fetch /mnt/build/Xilinx; rc=$?; set -e
          if [ $rc -eq 0 ]; then echo "mounted=true" >> "$GITHUB_OUTPUT"; elif [ $rc -eq 3 ]; then echo "mounted=false" >> "$GITHUB_OUTPUT"; else exit $rc; fi
      - name: Install Vivado (Zynq-7000 only)
        id: install
        if: steps.xsa-cache.outputs.cache-hit != 'true' && steps.vimg.outputs.mounted != 'true'
        env: { AMD_USER: '${{ secrets.AMD_USER }}', AMD_PASS: '${{ secrets.AMD_PASS }}', GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          # Java (xsetup) ignores TMPDIR and writes to /tmp on the root disk: move /tmp itself.
          sudo mount --bind /mnt/build/tmp /tmp && sudo chmod 1777 /tmp
          export _JAVA_OPTIONS="-Djava.io.tmpdir=/mnt/build/tmp" TMPDIR=/mnt/build/tmp
          # Guard: if the root disk still runs low, stop the installer while the runner can still
          # log, and show what grew (a full root disk kills the runner and loses the whole log).
          df -hT; lsblk -o NAME,SIZE,MOUNTPOINT | head -20
          # Every 10 s; stop at 8 GB free on the root disk or on the temp disk under the sparse volume.
          ( n=0; while sleep 10; do n=$((n+1))
              R=$(df --output=avail -BM / | tail -1 | tr -dc 0-9); M=$(df --output=avail -BM /mnt | tail -1 | tr -dc 0-9)
              [ $((n % 6)) -eq 0 ] && echo "[disk] root free ${R}M, /mnt free ${M}M, build used $(df -h /mnt/build | tail -1 | awk '{print $3}')"
              if [ "$R" -lt 8000 ] || [ "$M" -lt 8000 ]; then echo "[disk] LOW: root ${R}M /mnt ${M}M, stopping the installer"
                sudo du -xh --max-depth=3 / 2>/dev/null | sort -rh | head -20; sudo du -h --max-depth=3 /mnt/build 2>/dev/null | sort -rh | head -15
                pkill -f xsetup; pkill -f java; exit 0; fi; done ) &
          gh release download vivado-installer --pattern "*_Unified_${VIVADO_VERSION}_*_Lin64.bin" --dir /mnt/build/work \
            || { echo "no ${VIVADO_VERSION} web installer in release vivado-installer (the repository owner uploads it)"; exit 1; }
          cd /mnt/build/work && "$GITHUB_WORKSPACE/firmware/vivado-install.sh" "$(ls *_Unified_${VIVADO_VERSION}_*_Lin64.bin)" /mnt/build/Xilinx && rm -rf work-vivado *_Unified_${VIVADO_VERSION}_*_Lin64.bin && df -h /mnt/build
      - name: ADI plutosdr-fw v0.39 + timestamping (hdl + vendored timestamp IP only)
        if: steps.xsa-cache.outputs.cache-hit != 'true'
        run: firmware/fetch-fw.sh /mnt/build/work/fw --hdl-only
      - name: Synthesise and implement
        if: steps.xsa-cache.outputs.cache-hit != 'true'
        env: { VIVADO_SETTINGS: '/mnt/build/Xilinx/Vivado/${{ inputs.vivado || ''2022.2'' }}/settings64.sh' }
        run: firmware/build-hdl.sh /mnt/build/work/fw
      - name: Collect bitstream
        run: |
          mkdir -p xsa-cache
          [ -f xsa-cache/system_top.xsa ] || cp /mnt/build/work/fw/build/system_top.xsa xsa-cache/
          ls -la xsa-cache/system_top.xsa
      - name: Save Nano bitstream
        if: steps.xsa-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: xsa-cache/system_top.xsa, key: '${{ steps.key.outputs.key }}' }
      - name: Publish the installed Vivado image (once, after the bitstream; streamed parts)
        # also after a failed synthesis: the next run then skips the one-hour install
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: rm -rf /mnt/build/work/fw/build; firmware/vivado-image.sh publish /mnt/build/Xilinx
      - uses: actions/upload-artifact@v4
        with: { name: nano-system_top.xsa, path: xsa-cache/system_top.xsa, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always() && steps.xsa-cache.outputs.cache-hit != 'true'
        with: { name: vivado-logs, path: "/mnt/build/work/fw/hdl/projects/pluto/**/*.log", if-no-files-found: ignore }
  firmware:
    name: pluto.frm / pluto.dfu
    needs: hdl
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: false, android: true, dotnet: true, haskell: true, large-packages: true }
      - name: Build dependencies (as tezuka_fw uses on GitHub-hosted runners)
        run: sudo apt-get update -q && sudo apt-get install -y -q make gcc g++ zip unzip dfu-util fakeroot u-boot-tools device-tree-compiler mtools bison flex libncurses5-dev libssl-dev bc cpio rsync cmake xz-utils libgmp-dev libmpc-dev libclang-dev libgnutls28-dev curl python3 wget
      - name: ADI plutosdr-fw v0.39 + timestamping (all submodules)
        run: firmware/fetch-fw.sh "$PWD/fw"
      - uses: actions/download-artifact@v4
        with: { name: nano-system_top.xsa, path: xsa }
      - uses: ./.github/actions/fw-caches
      - name: btop (static ARMv7 musl, into the rootfs overlay)
        run: firmware/build-btop.sh firmware/br-external/board/nano/rootfs-overlay
      - name: Application (optional, release "app" of this repository)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: firmware/fetch-app.sh firmware/br-external/board/nano/rootfs-overlay
      - name: Assemble firmware
        run: firmware/build-fw.sh "$PWD/fw" xsa/system_top.xsa
      - uses: actions/upload-artifact@v4
        with: { name: pluto-nano-timestamp-frm, path: "fw/build/pluto.frm\nfw/build/pluto.frm.md5", if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: fw-build-log, path: fw-build.log, if-no-files-found: ignore }
