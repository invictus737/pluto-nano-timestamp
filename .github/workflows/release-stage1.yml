name: stage-1 release
# Publishes the stage-1 files of a finished firmware.yml run as release stage1-<short sha>: pluto.frm and
# pluto.dfu from the run, every boot*.frm (one per Tezuka v0.3.24 Nano FSBL, firmware/build-boot-frm.sh;
# those the run also built must be byte-identical), one SHA256SUMS and a README table.
on:
  # push only registers the workflow on this (non-default) branch; the job runs on dispatch
  push: { branches: [v0.39-std], paths: ['.github/workflows/release-stage1.yml'] }
  workflow_dispatch:
    inputs:
      firmware_run: { description: 'run id of a successful firmware.yml run', required: true, type: string }
permissions: { contents: write, actions: read }
jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', RUN: '${{ inputs.firmware_run }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Files of run ${{ inputs.firmware_run }}
        run: |
          [ "$(gh run view "$RUN" --json workflowName,conclusion -q '.workflowName + " " + .conclusion')" = "firmware (GitHub-hosted, Vivado installed in the job) success" ] || { echo "not a successful firmware.yml run"; exit 1; }
          SHA=$(gh run view "$RUN" --json headSha -q .headSha); echo "SHA=$SHA" >> "$GITHUB_ENV"; echo "TAG=stage1-${SHA:0:7}" >> "$GITHUB_ENV"
          gh run download "$RUN" -n pluto-nano-timestamp-frm -D run
          ls -la run
          [ -s run/pluto.frm ] && [ -s run/pluto.dfu ] || { echo "pluto.frm/pluto.dfu missing"; exit 1; }
          [ $(stat -c %s run/pluto.frm) -le 14680064 ] || { echo "pluto.frm above 14 MiB"; exit 1; }
      - name: boot*.frm (every Tezuka FSBL)
        run: |
          sudo apt-get install -y -q u-boot-tools > /dev/null
          firmware/build-boot-frm.sh - boot
          rm -f run/boot-cpu*.frm   # older runs also built clock variants: not published
          for f in run/boot*.frm; do cmp "$f" "boot/${f#run/}" || { echo "${f#run/} differs from the run's"; exit 1; }; echo "${f#run/} identical to the run's"; done
          mkdir -p out && cp run/pluto.frm run/pluto.dfu boot/boot*.frm out/
          cd out && sha256sum pluto.frm pluto.dfu boot*.frm > SHA256SUMS && cat SHA256SUMS
      - name: README
        run: |
          . firmware/tezuka-boot.sh
          cd out
          { echo "# $TAG"
            echo
            echo "Stage 1 standalone firmware for the HamGeek Pluto Nano (pluto-nano-timestamp ${SHA:0:7}, firmware.yml run $RUN)."
            echo "Copy \`pluto.frm\` and \`boot.frm\` together to the USB drive, then eject."
            echo "The CPU/DDR clock is a setting (config.txt \`[SYSTEM] cpu_clock\`, \`nexus-clock\`), default standard:"
            for v in $TZ_VARIANTS; do echo "- \`cpu_clock = $(tezuka_setting $v)\`: $(tezuka_label $v)"; done
            echo
            echo "| file | content | bytes | sha256 |"
            echo "|---|---|---|---|"
            echo "| \`pluto.frm\` | OS (FIT + md5), for every boot variant | $(stat -c %s pluto.frm) | \`$(sha256sum pluto.frm | cut -c1-16)…\` |"
            echo "| \`pluto.dfu\` | the same FIT without trailer, for a U-Boot DFU RAM boot only | $(stat -c %s pluto.dfu) | \`$(sha256sum pluto.dfu | cut -c1-16)…\` |"
            echo "| \`boot.frm\` | Tezuka FSBL (standard clocks) + U-Boot + NexusBS env | $(stat -c %s boot.frm) | \`$(sha256sum boot.frm | cut -c1-16)…\` |"
            echo
            echo "boot.frm carries the Tezuka v0.3.24 Nano BOOT.bin (sha256-pinned). Full checksums: SHA256SUMS."
          } > README.md
          cat README.md
      - name: Release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes-file out/README.md
          gh release edit "$TAG" --notes-file out/README.md
          gh release upload "$TAG" out/pluto.frm out/pluto.dfu out/boot*.frm out/SHA256SUMS out/README.md --clobber
